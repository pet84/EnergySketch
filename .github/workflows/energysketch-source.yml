name: EnergySketch source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energysketch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archcontrol:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Czech catalog
        run: python scripts/check_czech_translation.py
      - name: Test ArchControl with synthetic fixtures
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem tests/test_archcontrol*.py | ForEach-Object { $_.FullName }
          python -m pytest -q @testFiles tests/test_archenergy_layout.py tests/test_energy_basic_tools.py tests/test_restore_default_toolbars.py
